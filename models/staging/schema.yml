version: 2

models:
  - name: stg_client
    description: "Staging model pro klientská data s trimovanými textovými poli"
    columns:
      - name: id
        description: "Primární klíč klienta"
        tests:
          - unique
          - not_null
      - name: name
        description: "Jméno klienta (trimované)"
  
  - name: stg_revenue
    description: "Staging model pro revenue data"
    columns:
      - name: id
        description: "ID klienta"
        tests:
          - not_null
      - name: date
        description: "Datum transakce"
        tests:
          - not_null
      - name: revenue
        description: "Výše příjmu"
        tests:
          - not_null
