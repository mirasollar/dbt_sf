version: 2

sources:
  - name: crm_raw
    description: "Zdrojové tabulky z CRM_RAW schema"
    database: CRM_DATA
    schema: CRM_RAW
    tables:
      - name: client
        description: "Tabulka klientů"
        columns:
          - name: id
            description: "Primární klíč klienta"
            tests:
              - unique
              - not_null
      
      - name: revenue
        description: "Tabulka příjmů/výnosů"
        columns:
          - name: id
            description: "ID klienta"
          - name: date
            description: "Datum transakce"
          - name: revenue
            description: "Výše příjmu"
