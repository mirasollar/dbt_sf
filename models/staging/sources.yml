version: 2

sources:
  - name: dbt_test
    description: "Zdrojové tabulky z DBT_TEST schema"
    database: CRM_RAW
    schema: DBT_TEST
    tables:
      - name: client
        description: "Tabulka klientů"
        columns:
          - name: id
            description: "Primární klíč"
            tests:
              - unique
              - not_null
      
      - name: revenue
        description: "Tabulka příjmů/výnosů"
        columns:
          - name: id
            description: "ID klienta"
          - name: date
            description: "Datum transakce"
          - name: revenue
            description: "Výše příjmu"
